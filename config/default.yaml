controller:
  hero_chassis_controller:
    type: hero_chassis_controller/HeroChassisController
    wheel_r: 0.07625
    half_distance_x: 0.4
    half_distance_y: 0.4

    left_front_wheel_joint_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 5.0
      antiwindup: true
    right_front_wheel_joint_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 5.0
      antiwindup: true
    left_back_wheel_joint_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 5.0
      antiwindup: true
    right_back_wheel_joint_pid:
      p: 10.0
      i: 1.0
      d: 0.0
      i_clamp: 5.0
      antiwindup: true

  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50